name: Build and Push Docker Image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      frigate_version:
        description: "One-off Frigate base version, format x.y.z. Empty uses the FRIGATE_VERSION file."
        required: false
        default: ""
      all_variants:
        description: "Build all variants (tensorrt, rocm)"
        type: boolean
        default: false

# Cancel superseded runs for the same ref so rapid pushes to a test branch
# don't pile up full image builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version-sync:
    # Fails when Dockerfile or README no longer match FRIGATE_VERSION, so a bump
    # cannot land half-applied. Cheap enough to run on every push.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check generated version references
        run: python3 scripts/sync-version.py --check

  build-standard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set Frigate version
        env:
          INPUT_VERSION: ${{ inputs.frigate_version }}
        run: |
          # FRIGATE_VERSION at the repo root is the single source for the pinned
          # base; a workflow_dispatch input overrides it for one-off builds.
          echo "FRIGATE_VERSION=${INPUT_VERSION:-$(cat FRIGATE_VERSION)}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=frigate-${{ env.FRIGATE_VERSION }},enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/master' }}
            type=ref,event=pr

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FRIGATE_VERSION=${{ env.FRIGATE_VERSION }}
            ABR_COMMIT=${{ github.sha }}
            ABR_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=standard
          cache-to: type=gha,mode=max,scope=standard
          platforms: linux/amd64

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  build-variants:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.all_variants) || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    strategy:
      matrix:
        variant:
          - suffix: "-tensorrt"
          - suffix: "-rocm"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set Frigate version
        env:
          INPUT_VERSION: ${{ inputs.frigate_version }}
        run: |
          BASE="${INPUT_VERSION:-$(cat FRIGATE_VERSION)}"
          echo "FRIGATE_VERSION=${BASE}${{ matrix.variant.suffix }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest${{ matrix.variant.suffix }}
            type=raw,value=frigate-${{ env.FRIGATE_VERSION }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FRIGATE_VERSION=${{ env.FRIGATE_VERSION }}
            ABR_COMMIT=${{ github.sha }}
            ABR_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ env.FRIGATE_VERSION }}
          cache-to: type=gha,mode=max,scope=${{ env.FRIGATE_VERSION }}
          platforms: linux/amd64

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  check-frigate-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for new Frigate release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_VERSION=$(cat FRIGATE_VERSION)
          LATEST=$(gh api repos/blakeblackshear/frigate/releases/latest --jq .tag_name | sed 's/^v//')

          echo "Current pinned: $CURRENT_VERSION"
          echo "Latest Frigate: $LATEST"

          if [ "$LATEST" != "$CURRENT_VERSION" ]; then
            echo "::warning::New Frigate release available: $LATEST (currently pinned to $CURRENT_VERSION)"

            EXISTING=$(gh issue list --search "Update Frigate base to $LATEST" --json number --jq length)
            if [ "$EXISTING" = "0" ]; then
              gh issue create \
                --title "Update Frigate base to $LATEST" \
                --body "A new Frigate stable release **$LATEST** is available. Current pinned version is **$CURRENT_VERSION**.

          To update:
          1. \`echo $LATEST > FRIGATE_VERSION\`
          2. \`python3 scripts/sync-version.py\` (rewrites the Dockerfile default and the README tables)
          3. Test the build
          4. Push to master, which rebuilds and retags every variant

          Or trigger a one-off build without moving the pin: Actions -> Build and Push -> Run workflow -> set version to $LATEST"
            fi
          fi
